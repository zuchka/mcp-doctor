[project]
name = "mcp-doctor"
version = "0.1.0"
description = "A deterministic quality lab for MCP server interfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0,<5",
    "pydantic>=2.11,<3",
]

[project.scripts]
mcp-doctor = "mcp_doctor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
